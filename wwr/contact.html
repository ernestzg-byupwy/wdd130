<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rafting Travel</title>
    <meta name="description"
      content="Shows contact information and provides a form so the user can share the contact information.">
    <meta name="author" content="Ernesto Zeledon">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting-travel-logo.jpg" alt="Rafting Company Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <div id="company-info">
                <h1>Rafting Travel Company</h1>
                <address>
                    123 Main River Street <br>
                    Kolob, California 12345 <br>
                    +1 999 999 9999 <br>
                    info@raftingtravel.com <br>
                </address>
            </div>
            <div id="map-form">
                <div id="map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d31795.151652399843!2d-76.0539186000825!3d-5.039700315867044!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2ssv!4v1770606748550!5m2!1ses!2ssv"
                      allowfullscreen="" loading="lazy"
                      referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
                <form action="">
                    <div class="form-item">
                        <label for="fullname">Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Full Name">
                    </div>
                    <div class="form-item">
                        <label for="mail">Email</label>
                        <input type="email" id="mail" name="mail" placeholder="user@example.com">
                    </div>
                    <div class="form-item">
                        <span>Message Purpose</span>
                        <div id="purpose-items">
                            <input type="radio" id="general" name="purpose" value="general">
                            <label for="general">General Inquiry</label>
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                            <input type="radio" id="website" name="purpose" value="website">
                            <label for="website">Website Suggestion</label>
                        </div>
                    </div>
                    <div class="form-item message-area">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Type here"></textarea>
                    </div>
                    <div id="subs-div" class="form-item">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                    </div>
                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </section>
        <section id="emp-section" class="contact-info">
            <h1>We Are Here to Serve You</h1>
            <div id="employees-info">
                <figure>
                    <img src="images/employee-2.jpg" alt="">
                    <figcaption>Beginners Tour Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-1.jpg" alt="">
                    <figcaption>Senior Rafting Expert</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-3.jpg" alt="">
                    <figcaption>Entertainment Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <!-- <p>&copy; 2026 &#10070; Ernesto Zeledon &#10070;</p> -->
        <p>&copy; 2026 - Rafting Travel | Ernesto Zeledon</p>
        <nav class="socialmedia">
            <a href="https://facebook.com/" target="_blank"><img src="images/facebook-logo.svg"
                  alt="Facebook logo."></a>
            <a href="https://instagram.com/" target="_blank"><img src="images/instagram-logo.svg"
                  alt="Instagram logo."></a>
            <a href="https://www.tiktok.com/" target="_blank"><img src="images/tictok-bw-logo.svg"
                  alt="TikTok logo."></a>
        </nav>
    </footer>
</body>

</html>
